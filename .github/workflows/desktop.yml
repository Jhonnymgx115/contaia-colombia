name: Empaquetado de escritorio (Windows / Linux / macOS)

on:
  push:
    branches: [desktop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # necesario para publicar el Release con instaladores

jobs:
  # Crea el Release una sola vez antes de que los 3 SO suban sus archivos.
  crear-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear release del tag (si no existe)
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "ContaIA Colombia $GITHUB_REF_NAME" \
            --notes "Instaladores de escritorio de ContaIA Colombia $GITHUB_REF_NAME.

          - **Windows:** ContaIA-Colombia-Setup-x.y.z.exe (instalador) o el portable.
          - **Linux:** .AppImage (ejecutable universal) o .deb (Debian/Ubuntu).
          - **macOS:** .dmg

          La aplicación incluye PostgreSQL embebida: no requiere instalar nada más.
          Sus datos quedan en la carpeta de usuario de cada sistema." \
            || echo "El release ya existe; se continuarán subiendo archivos."
        env:
          GH_TOKEN: ${{ github.token }}

  empaquetar:
    needs: crear-release
    if: always()  # en pushes a la rama (sin tag) no hay release que esperar
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win nsis portable
          - os: ubuntu-latest
            target: --linux AppImage deb
          - os: macos-latest
            target: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generar cliente Prisma
        run: npx prisma generate
      - name: Pruebas unitarias
        run: npx vitest run
      - name: Build standalone de Next.js
        run: npm run build
      - name: Empaquetar instalador (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.target }} --publish never
      # Descarga pública: en tags, los instaladores se adjuntan al Release.
      - name: Publicar instaladores en el Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" dist-empaquetado/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # En pushes normales a la rama, quedan como artifacts de CI (90 días).
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ContaIA-${{ matrix.os }}
          path: |
            dist-empaquetado/*.exe
            dist-empaquetado/*.AppImage
            dist-empaquetado/*.deb
            dist-empaquetado/*.dmg
