name: Pruebas de ContaIA

on:
  push:
    branches: [main, dev, v0, web, desktop]
  pull_request:
    branches: [main, dev, v0, web, desktop]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install streamlit pandas openpyxl python-dotenv requests pytest
      - name: Ejecutar pruebas Python (edición Streamlit)
        run: pytest tests/ -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verificación de tipos
        run: npx tsc --noEmit
      - name: Pruebas Vitest (edición web)
        run: npx vitest run
