services:
  postgres:
    image: postgres:16-alpine
    container_name: contaia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contaia
      POSTGRES_PASSWORD: contaia_dev   # solo desarrollo; en producción use variables de entorno
      POSTGRES_DB: contaia
    ports:
      - "5432:5432"
    volumes:
      - contaia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contaia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  contaia_pgdata:
